<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday (. ❛ ᴗ ❛.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=DotGothic16&family=Grape+Nuts&display=swap" rel="stylesheet">

<style>
  :root {
    --plum: #24182f;
    --cream: #fff4e6;
    --blush: #f7a1b5;
    --cherry: #ef476f;
    --brown: #5b2b1f;
    --lavender: #c9b6d8;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "DotGothic16", sans-serif;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  .dotgothic16-regular {
    font-family: "DotGothic16", sans-serif;
   font-weight: 400;
   font-style: normal;
  }


  .grape-nuts-regular {
  font-family: "Grape Nuts", cursive;
  font-weight: 400;
  font-style: normal;
}

  .hero {
    background-image: url("images/img2.jpeg");
    background-size: cover;
    background-position: center;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .overlay {
    background: rgba(24, 14, 32, 0.68);
    position: absolute;
    inset: 0;
  }

  .content {
    position: relative;
    color: var(--cream);
    text-align: center;
    padding: 20px;
    max-width: 90%;
    font-family: "DotGothic16", sans-serif;
  }

  .content h1 {
    font-size: 5em;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .content p {
    font-size: 2em;
    margin-bottom: 20px;
    line-height: 1.8;
    color: var(--lavender);
  }

  .countdown {
    font-size: 2em;
    font-weight: normal;
    margin-top: 20px;
    color: var(--blush);
    line-height: 1.8;
  }

  .message-progress {
    color: var(--cream);
    font-size: 1.1em;
    margin: 10px 0 0;
    opacity: 0.9;
  }

  .message-button {
    margin-top: 30px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    transition: transform 0.3s, filter 0.3s;
    border-radius: 15px;
    overflow: hidden;
  }

  .message-button img {
    display: block;
    width: 200px;
    height: auto;
    border-radius: 15px;
    transition: transform 0.3s;
  }

  .message-button:hover {
    transform: scale(1.1);
  }

  .message-button:hover img {
    transform: scale(1.05);
  }

  .message-button:active {
    transform: scale(0.95);
  }

  /* Message Popup Modal */
  /* Snow Effect */
  .snow-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .snowflake {
    position: absolute;
    top: -20px;
    font-size: 20px;
    animation: fall linear infinite;
    user-select: none;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) translateX(calc(var(--drift, 50px))) rotate(360deg);
      opacity: 0.8;
    }
  }

  .message-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    animation: fadeIn 0.3s;
  }

  .message-modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .message-content {
    background: var(--cream);
    padding: 40px;
    border-radius: 20px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.4s;
    position: relative;
    color: var(--brown);
    font-family: "DotGothic16", sans-serif;
  }

  .message-content h2 {
    font-size: 4em;
    margin-bottom: 20px;
    color: var(--plum);
    line-height: 1.8;
  }

  .message-content p {
    font-size: 2.5em;
    line-height: 2;
    color: var(--brown);
  }

  .confetti {
    height: 10px;
    pointer-events: none;
    position: fixed;
    width: 7px;
    z-index: 2000;
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 2em;
    font-weight: bold;
    color: var(--cherry);
    cursor: pointer;
    transition: transform 0.2s;
    font-family: "DotGothic16", cursive, monospace;
  }

  .close-btn:hover {
    transform: scale(1.2);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from {
      transform: translateY(50px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  @media (max-width: 600px) {
    .content h1 {
      font-size: 2em;
    }
    .content p {
      font-size: 1.2em;
    }
    .countdown {
      font-size: 1.2em;
    }
    .message-progress {
      font-size: 0.95em;
    }
    .message-content {
      padding: 30px 20px;
    }
    .message-content h2 {
      font-size: 1.2em;
    }
    .message-content p {
      font-size: 0.9em;
    }
    .message-button img {
      width: 150px;
    }
  }
</style>
</head>

<body>

<!-- Song Container -->
<div id="songContainer"></div>

<!-- Snow Container -->
<div class="snow-container" id="snowContainer"></div>

<div class="hero">
  <div class="overlay"></div>

  <div class="content">
    <h1>Happy Birthday</h1>
    <h1>(. ❛ ᴗ ❛.)</h1>
    <p>Tap the cake for some special messages ive prepared for you :>  </p>

    <div class="countdown" id="countdown">
      Counting down to New Year...
    </div>
    <p class="message-progress" id="messageProgress">Message 0 of 12 opened</p>

    <button class="message-button" id="messageButton">
      <img src="images/cakeimg.jpeg" alt="Click for a special message">
    </button>
  </div>
</div>

<!-- Message Popup Modal -->
<div class="message-modal" id="messageModal">
  <div class="message-content">
    <span class="close-btn" id="closeBtn">&times;</span>
    <h2 id="messageTitle">OuO</h2>
    <p id="messageText"></p>
  </div>
</div>

<script>
  function updateCountdown() {
    const now = new Date();
    const year = now.getFullYear() + 1;
    const newYear = new Date(`January 1, ${year} 00:00:00`);
    const diff = newYear - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
      `Btw New Year in ${days}d ${hours}h ${minutes}m ${seconds}s `;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  const songs = [
    'music/music1.mp3',
    'music/music2.mp3',
    'music/music3.mp3'
  ];
  
  let currentSongIndex = 0;
  let audioPlayer = null;
  let hasStartedPlaying = false;

  function playNextSong() {
    if (currentSongIndex >= songs.length) {
      currentSongIndex = 0;
    }

    if (audioPlayer) {
      audioPlayer.remove();
    }
    
    audioPlayer = document.createElement('audio');
    audioPlayer.src = songs[currentSongIndex];
    audioPlayer.volume = 1.0;
    audioPlayer.preload = 'auto';
    
    // When song ends, play next one
    audioPlayer.addEventListener('ended', () => {
      currentSongIndex++;
      playNextSong();
    });

    // Add to container
    const songContainer = document.getElementById('songContainer');
    songContainer.appendChild(audioPlayer);
    
    // Try to play the audio
    const playPromise = audioPlayer.play();
    
    // Handle autoplay restrictions
    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          hasStartedPlaying = true;
        })
        .catch((error) => {
          // Autoplay was prevented - will start on user interaction
          console.log('Autoplay prevented, waiting for user interaction');
        });
    }
  }

  // Function to start playing on user interaction
  function startPlaybackOnInteraction() {
    if (!hasStartedPlaying && audioPlayer) {
      audioPlayer.play()
        .then(() => {
          hasStartedPlaying = true;
        })
        .catch((error) => {
          console.log('Playback failed:', error);
        });
    }
  }

  // Start playing songs when page loads
  playNextSong();

  // Start playback on first user interaction (click, touch, or keypress)
  document.addEventListener('click', startPlaybackOnInteraction, { once: true });
  document.addEventListener('touchstart', startPlaybackOnInteraction, { once: true });
  document.addEventListener('keydown', startPlaybackOnInteraction, { once: true });

  // Snow Effect
  function createSnow() {
    const snowContainer = document.getElementById('snowContainer');
    const snowEmojis = ['🌻', '🌟', '🍁', ''];
    const numSnowflakes = 50;

    for (let i = 0; i < numSnowflakes; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = snowEmojis[Math.floor(Math.random() * snowEmojis.length)];
      
      // Random starting position
      snowflake.style.left = Math.random() * 100 + '%';
      
      // Random animation duration (5-15 seconds)
      const duration = 5 + Math.random() * 10;
      snowflake.style.animationDuration = duration + 's';
      
      // Random delay to stagger the snowflakes
      snowflake.style.animationDelay = Math.random() * 5 + 's';
      
      // Random horizontal drift
      const drift = (Math.random() - 0.5) * 100;
      snowflake.style.setProperty('--drift', drift + 'px');
      
      snowContainer.appendChild(snowflake);
    }
  }

  // Start snow effect when page loads
  createSnow();

  // Array of messages
  const messages = [
    "Happy Birthday to my dearest PONNU 🎉",
    "I wish I could be next to you to celebrate today",
    "I can't believe you're an old man now",
    "Good job on making it to 25 ponnue",
    "I hope you live to be 100 years old ngl",
    "When u come back home let's celebrate properly together okay?",
    "Thank you for everything you've done for me",
    "For listening and understanding me and my issues",
    "I'm lucky to have you as my brother",
    "Amma would be proud of how far you've come ponnu",
    "I'm proud of you ponnu cheta",
    "Love you kore kore🫂"
];

  // Get elements
  const messageButton = document.getElementById('messageButton');
  const messageModal = document.getElementById('messageModal');
  const messageText = document.getElementById('messageText');
  const messageTitle = document.getElementById('messageTitle');
  const closeBtn = document.getElementById('closeBtn');
  const messageProgress = document.getElementById('messageProgress');

  // Track current message index
  let currentMessageIndex = 0;

  // Function to show messages in order
  function showNextMessage() {
    messageText.textContent = messages[currentMessageIndex];
    messageModal.classList.add('active');
    const openedMessage = currentMessageIndex + 1;
    messageProgress.textContent = `Message ${openedMessage} of ${messages.length} opened`;
    createConfetti();
    // Move to next message, wrap around when reaching the end
    currentMessageIndex = (currentMessageIndex + 1) % messages.length;
  }

  function createConfetti() {
    const colors = ['#ef476f', '#f7a1b5', '#fff4e6', '#c9b6d8'];
    for (let i = 0; i < 45; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti';
      piece.style.backgroundColor = colors[i % colors.length];
      piece.style.left = `${45 + Math.random() * 10}vw`;
      piece.style.top = '35vh';
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      piece.animate([
        { transform: piece.style.transform, opacity: 1 },
        {
          transform: `translate(${(Math.random() - 0.5) * 500}px, ${250 + Math.random() * 350}px) rotate(${Math.random() * 720}deg)`,
          opacity: 0
        }
      ], { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.2,.8,.3,1)' });
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 1700);
    }
  }

  // Click handler for message button
  messageButton.addEventListener('click', () => {
    startPlaybackOnInteraction();
    showNextMessage();
  });

  // Close modal handlers
  closeBtn.addEventListener('click', () => {
    messageModal.classList.remove('active');
  });

  messageModal.addEventListener('click', (e) => {
    if (e.target === messageModal) {
      messageModal.classList.remove('active');
    }
  });

  // Close on Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && messageModal.classList.contains('active')) {
      messageModal.classList.remove('active');
    }
  });
</script>
</body>
</html>
